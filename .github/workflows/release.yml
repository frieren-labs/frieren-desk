name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '.archify/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide tag
        id: tag
        run: |
          if git log -1 --pretty=%B | grep -q "\[skip release\]"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release skipped by commit message."
            exit 0
          fi
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=2
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            tag="$base-$n"
            n=$((n + 1))
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          prev=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV="${{ steps.tag.outputs.prev }}"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          NOTES=$(git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges | head -50)
          gh release create "$TAG" --title "$TAG" --notes "## $TAG

          ### Changes
          $NOTES

          ### Install
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/jd-apprentice/frieren-desk/main/install.sh | bash
          \`\`\`"
