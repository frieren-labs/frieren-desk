name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash syntax check
        run: |
          bash -n install.sh
          for f in tools/*.sh quickshell/frieren/hooks/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: install glib dev
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

      - name: compile tray
        run: cc -O2 -o /tmp/frieren-tray quickshell/frieren/tray.c $(pkg-config --cflags --libs gio-2.0)

      - name: install qmllint and Qt QML modules
        run: sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates

      - name: qmllint components
        env:
          QML_IMPORT_PATH: /usr/lib/x86_64-linux-gnu/qt6/qml
        run: |
          BIN=$(dpkg -L qt6-declarative-dev-tools | grep -E '/qmllint$' | head -1)
          [ -n "$BIN" ] || { echo "qmllint not found in qt6-declarative-dev-tools"; exit 1; }
          "$BIN" -i tools/qmltypes/quickshell-core.qmltypes -i tools/qmltypes/quickshell-io.qmltypes quickshell/frieren/components/*.qml 2>&1 | tee /tmp/qmllint.log
          # Quickshell is not installed in CI, so [import] warnings for its
          # modules are environmental noise. [unqualified] fires on idiomatic QML
          # (delegate modelData, own properties) and on the same missing module.
          # Fail on any other, real, diagnostic instead.
          if grep "Warning:" /tmp/qmllint.log | grep -v "\[import\]" | grep -v "\[unqualified\]" | grep -q .; then
            echo "real qmllint warnings found (non-import, non-unqualified)"; exit 1
          fi
          echo "clean apart from third-party [import]/[unqualified] warnings"

      - name: qmllint shell (informational)
        continue-on-error: true
        env:
          QML_IMPORT_PATH: /usr/lib/x86_64-linux-gnu/qt6/qml
        run: |
          BIN=$(dpkg -L qt6-declarative-dev-tools | grep -E '/qmllint$' | head -1)
          [ -n "$BIN" ] && "$BIN" -i tools/qmltypes/quickshell-core.qmltypes -i tools/qmltypes/quickshell-io.qmltypes quickshell/frieren/shell.qml || echo "shell.qml lint is informational (Wayland/Quickshell modules not installed)"
